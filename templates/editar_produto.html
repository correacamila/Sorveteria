{% extends "base.html" %}

{% block title %}Editar Produto - Administração{% endblock %}

{% block content %}

<section class="pagina-titulo">
    <span class="tag">ADMINISTRAÇÃO</span>
    <h1>Editar produto</h1>
    <p>Atualize as informações do produto.</p>
</section>

<section class="admin-tabela-section">

    <div class="admin-titulo">
        <span>🍨</span>
        <div>
            <h2>{{ produto.nome }}</h2>
            <p>Altere os dados abaixo e salve as mudanças.</p>
        </div>
    </div>

    <div class="formulario-box">
        <form method="POST">

            <label>Nome</label>
            <input type="text" name="nome" value="{{ produto.nome }}" required>

            <label>Descrição</label>
            <input type="text" name="descricao" value="{{ produto.descricao }}" required>

            <label>Categoria</label>
            <input type="text" name="categoria" value="{{ produto.categoria }}" required>

            <label>Preço</label>
            <input type="number" name="preco" value="{{ produto.preco }}" step="0.01" min="0" required>

            <button class="botao" type="submit">Salvar alterações</button>

        </form>

        <a class="botao secundario" href="{{ url_for('admin_produtos') }}">
            Voltar para produtos
        </a>
    </div>

</section>

{% endblock %}
