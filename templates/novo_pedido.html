{% extends "base.html" %}
{% block title %}Novo Pedido - Doce Neve{% endblock %}
{% block content %}

<section class="pagina-titulo">
    <span class="tag">FAÇA SEU PEDIDO</span>
    <h1>Novo pedido 🍦</h1>
    <p>Escolha seu sabor e a quantidade que deseja.</p>
</section>

<section class="formulario-box">
    <form method="POST">
        <label for="produto_id">Escolha o sabor</label>
        <select name="produto_id">
            {% for produto in produtos %}
                <option value="{{ produto.id }}" {% if produto.id == produto_id %}selected{% endif %}>{{ produto.nome }}</option>
            {% endfor %}
        </select>

        <label for="quantidade">Quantidade</label>
        <input type="number" name="quantidade" id="quantidade" min="1" value="1" required>

        <button class="botao" type="submit">Confirmar pedido 🍨</button>
    </form>
</section>

{% endblock %}
